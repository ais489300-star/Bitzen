name: CF Workflow 3 - Projects 11-15

on:
  workflow_run:
    workflows: ["CF Workflow 2 - Projects 6-10"]
    types:
      - completed
  workflow_dispatch:  # Allows manual trigger

jobs:
  run-projects:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        project: [project11, project12, project13, project14, project15]
      fail-fast: false
      max-parallel: 1
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run CF ${{ matrix.project }}
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          echo "Running CF ${{ matrix.project }}..."
          python -m CF.${{ matrix.project }}.main

      - name: Upload logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-${{ matrix.project }}-logs
          path: |
            *.log
            temp_downloads/
          retention-days: 7
          if-no-files-found: ignore
